# Azure DevOps Pipeline for Power BI Deployment
# Deploy semantic models and reports to Power BI Service

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - 'models/**'
      - 'reports/**'

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - prod

  - name: deployModel
    displayName: 'Deploy Semantic Model'
    type: boolean
    default: true

  - name: deployReports
    displayName: 'Deploy Reports'
    type: boolean
    default: true

  - name: refreshAfterDeploy
    displayName: 'Refresh Dataset After Deploy'
    type: boolean
    default: false

variables:
  - group: 'powerbi-${{ parameters.environment }}'
  - name: workspaceId
    value: '$(PBI_WORKSPACE_ID)'
  - name: modelPath
    value: '$(Build.SourcesDirectory)/models'
  - name: reportsPath
    value: '$(Build.SourcesDirectory)/reports'

stages:
  - stage: Validate
    displayName: 'Validate Artifacts'
    jobs:
      - job: ValidateTMDL
        displayName: 'Validate TMDL Syntax'
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: PowerShell@2
            displayName: 'Install Tabular Editor'
            inputs:
              targetType: 'inline'
              script: |
                # Install Tabular Editor CLI
                dotnet tool install -g TabularEditor.TOMWrapper.NetCore
                
          - task: PowerShell@2
            displayName: 'Validate Model'
            inputs:
              targetType: 'inline'
              script: |
                $modelFolder = "$(modelPath)"
                if (Test-Path "$modelFolder/model.tmdl") {
                    Write-Host "Validating TMDL model..."
                    # Basic syntax validation
                    $content = Get-Content "$modelFolder/model.tmdl" -Raw
                    if ($content -match "model") {
                        Write-Host "TMDL structure appears valid"
                    }
                }
                else {
                    Write-Host "No TMDL model found - skipping validation"
                }

  - stage: Deploy
    displayName: 'Deploy to ${{ parameters.environment }}'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployModel
        displayName: 'Deploy Semantic Model'
        condition: eq('${{ parameters.deployModel }}', true)
        environment: 'powerbi-${{ parameters.environment }}'
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: PowerShell@2
                  displayName: 'Install Power BI Module'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Install-Module -Name MicrosoftPowerBIMgmt -Scope CurrentUser -Force

                - task: PowerShell@2
                  displayName: 'Connect to Power BI'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $securePassword = ConvertTo-SecureString "$(PBI_CLIENT_SECRET)" -AsPlainText -Force
                      $credential = New-Object System.Management.Automation.PSCredential("$(PBI_APP_ID)", $securePassword)
                      Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId "$(PBI_TENANT_ID)"

                - task: PowerShell@2
                  displayName: 'Deploy TMDL Model'
                  inputs:
                    targetType: 'inline'
                    script: |
                      # Use Tabular Editor or XMLA endpoint for TMDL deployment
                      Write-Host "Deploying model to workspace: $(workspaceId)"
                      
                      # Example using Tabular Editor CLI
                      # tabular-editor deploy "$(modelPath)" "$(PBI_XMLA_ENDPOINT)" "$(PBI_DATASET_NAME)"
                      
                      Write-Host "Model deployment complete"

      - deployment: DeployReports
        displayName: 'Deploy Reports'
        condition: eq('${{ parameters.deployReports }}', true)
        dependsOn: DeployModel
        environment: 'powerbi-${{ parameters.environment }}'
        pool:
          vmImage: 'windows-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: PowerShell@2
                  displayName: 'Deploy PBIX Reports'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Import-Module MicrosoftPowerBIMgmt
                      
                      $securePassword = ConvertTo-SecureString "$(PBI_CLIENT_SECRET)" -AsPlainText -Force
                      $credential = New-Object System.Management.Automation.PSCredential("$(PBI_APP_ID)", $securePassword)
                      Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId "$(PBI_TENANT_ID)"
                      
                      $reportFiles = Get-ChildItem "$(reportsPath)" -Filter "*.pbix"
                      
                      foreach ($report in $reportFiles) {
                          Write-Host "Deploying report: $($report.Name)"
                          New-PowerBIReport -Path $report.FullName -WorkspaceId "$(workspaceId)" -ConflictAction CreateOrOverwrite
                      }
                      
                      Disconnect-PowerBIServiceAccount

  - stage: PostDeploy
    displayName: 'Post-Deployment Tasks'
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: RefreshDataset
        displayName: 'Refresh Dataset'
        condition: eq('${{ parameters.refreshAfterDeploy }}', true)
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: PowerShell@2
            displayName: 'Trigger Dataset Refresh'
            inputs:
              targetType: 'inline'
              script: |
                Import-Module MicrosoftPowerBIMgmt
                
                $securePassword = ConvertTo-SecureString "$(PBI_CLIENT_SECRET)" -AsPlainText -Force
                $credential = New-Object System.Management.Automation.PSCredential("$(PBI_APP_ID)", $securePassword)
                Connect-PowerBIServiceAccount -ServicePrincipal -Credential $credential -TenantId "$(PBI_TENANT_ID)"
                
                $datasetId = "$(PBI_DATASET_ID)"
                $workspaceId = "$(workspaceId)"
                
                Write-Host "Triggering refresh for dataset: $datasetId"
                Invoke-PowerBIRestMethod -Url "groups/$workspaceId/datasets/$datasetId/refreshes" -Method Post
                
                Write-Host "Refresh triggered successfully"
                Disconnect-PowerBIServiceAccount

      - job: UpdateRLS
        displayName: 'Update Row-Level Security'
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: PowerShell@2
            displayName: 'Apply RLS Roles'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "RLS configuration would be applied here"
                # Add RLS update logic if needed
